[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-platform"
version = "0.1.0"
description = "A hybrid retrieval and evaluation platform for technical documents: BM25, dense embeddings, reciprocal rank fusion, cross-encoder reranking, and Recall@K / nDCG@K benchmarking."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Andrew Woods" }]

dependencies = [
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
